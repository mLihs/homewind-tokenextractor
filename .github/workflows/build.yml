name: Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
          PYTHONPATH=src pytest -q

  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller pillow

      - name: Build macOS app
        run: |
          rm -rf dist build
          pyinstaller HomewindTokenExtractor.spec --clean -y
          
      - name: Create ZIP for artifact
        run: |
          cd dist
          zip -r HomewindTokenExtractor-macOS.zip HomewindTokenExtractor.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomewindTokenExtractor-macOS-AppleSilicon
          path: dist/HomewindTokenExtractor-macOS.zip
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller pillow

      - name: Build Windows app
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          pyinstaller HomewindTokenExtractor.spec --clean -y

      - name: Create ZIP for artifact
        run: |
          cd dist
          Compress-Archive -Path HomewindTokenExtractor -DestinationPath HomewindTokenExtractor-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomewindTokenExtractor-Windows
          path: dist/HomewindTokenExtractor-Windows.zip
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller pillow

      - name: Build Linux app
        run: |
          rm -rf dist build
          pyinstaller HomewindTokenExtractor.spec --clean -y


      - name: Create archive
        run: |
          cd dist
          tar -czf HomewindTokenExtractor-Linux.tar.gz HomewindTokenExtractor

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomewindTokenExtractor-Linux
          path: dist/HomewindTokenExtractor-Linux.tar.gz
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            HomewindTokenExtractor-macOS-AppleSilicon/HomewindTokenExtractor-macOS.zip
            HomewindTokenExtractor-Windows/HomewindTokenExtractor-Windows.zip
            HomewindTokenExtractor-Linux/HomewindTokenExtractor-Linux.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

